<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>lgtm</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <script>
    // Apply the saved theme before first paint (no flash).
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
    // And the text sizes (look.ts).
    try { const s = document.documentElement.style, ts = localStorage.getItem('textSize') ?? 13, cs = localStorage.getItem('codeSize') ?? 11; s.setProperty('--ts', ts / 14); s.setProperty('--cs', cs / 12); } catch {}
  </script>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
