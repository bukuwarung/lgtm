[package]
name = "lgtm"
version = "0.18.0"
description = "Say LGTM and mean it: fast GitHub and GitLab code review"
edition = "2021"

[lib]
name = "lgtm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
muda = "0.20" # the menu bar item's menu, built natively (Tauri's own menus are muda's)

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6" # the menu bar menu's symbols, indents and bold headings
objc2-foundation = { version = "0.3", features = ["NSString", "NSAttributedString", "NSDictionary"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSImage", "NSFont", "NSAttributedString", "NSWorkspace", "NSAccessibility"] }
mac-notification-sys = "0.6" # notifications that say when they're clicked (the plugin's don't, on macOS)
