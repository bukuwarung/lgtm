[package]
name = "lgtm"
version = "0.1.0"
description = "Fast GitHub PR review"
edition = "2021"

[lib]
name = "lgtm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
